name: areca-demo

services:
  cms:
    image: ${CMS_IMAGE:-ghcr.io/seirai-dev/areca-cms:latest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${CMS_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://areca:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/areca
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${CMS_URL:-http://localhost:3000}
      APP_URL: ${CMS_URL:-http://localhost:3000}
      DOKPLOY_CREDENTIALS_ENCRYPTION_KEY: ${DOKPLOY_CREDENTIALS_ENCRYPTION_KEY:?Set DOKPLOY_CREDENTIALS_ENCRYPTION_KEY in .env}
      AI_SETTINGS_ENCRYPTION_KEY: ${AI_SETTINGS_ENCRYPTION_KEY:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: areca
      S3_PREFIX: ${S3_PREFIX:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-areca-demo}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_FORCE_PATH_STYLE: "true"
      # Mail defaults to the bundled Mailpit. Point these at your provider, or
      # leave them and configure Agency → Mail after signing in.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-cms@areca.local}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      # Optional operations settings; empty means the CMS default.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-}
      DB_IDLE_IN_TX_TIMEOUT_MS: ${DB_IDLE_IN_TX_TIMEOUT_MS:-}
      READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-}
      READINESS_MAX_QUEUE_AGE_SECONDS: ${READINESS_MAX_QUEUE_AGE_SECONDS:-}
      READINESS_MAX_TICK_AGE_SECONDS: ${READINESS_MAX_TICK_AGE_SECONDS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      mailpit:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: areca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: areca
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U areca -d areca"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-areca-demo}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    command: ["/data"]
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
