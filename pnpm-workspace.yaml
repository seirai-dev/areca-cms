packages:
  - "apps/*"
  - "apps/landing/video"
  - "packages/*"
  - "examples/*"
  - "*"

allowBuilds:
  esbuild: true
  lightningcss: true
  better-sqlite3: true
  unrs-resolver: true
  sharp: true
  workerd: true
  '@openrouter/sdk': false

minimumReleaseAgeExclude:
  - '@tanstack/markdown@1.0.0'
  - '@tanstack/react-router@1.170.41'
  - '@tanstack/react-start-client@1.168.39'
  - '@tanstack/react-start-rsc@0.1.59'
  - '@tanstack/react-start-server@1.167.46'
  - '@tanstack/react-start@1.168.60'
  - '@tanstack/router-core@1.171.34'
  - '@tanstack/router-generator@1.167.40'
  - '@tanstack/router-plugin@1.168.42'
  - '@tanstack/start-client-core@1.170.34'
  - '@tanstack/start-plugin-core@1.171.49'
  - '@tanstack/start-server-core@1.169.39'
  - '@tanstack/start-storage-context@1.167.36'
  - '@fumadocs/base-ui@16.17.1'
  - '@fumadocs/tailwind@0.1.3'
  - fumadocs-core@16.17.1
  - fumadocs-mdx@15.4.7
  - '@areca-cms/site-sdk@0.3.0'

overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # Patched transitive versions (pnpm audit --prod). Remove once the parent packages ship them.
  seroval: ">=1.6.3"
  source-map-js: ">=1.2.2"
  "@vitest/mocker": ">=5.0.3"
  vite: ">=8.3.3"
  # One prosemirror copy workspace-wide. Two copies make TipTap throw "Can not convert ... to a Fragment".
  prosemirror-model: 1.25.12
  prosemirror-view: 1.42.9
  prosemirror-transform: 1.12.5
