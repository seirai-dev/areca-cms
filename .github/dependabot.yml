# Weekly dependency updates, grouped so each ecosystem opens at most a few PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the Go compiler) breaks typescript-eslint and the
      # compiler API the site-sdk tests use. Lift this once both support it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node types follow the Node runtime (24, see engines and the
      # Dockerfile). Bump this major by hand when Node is upgraded.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories:
      - /apps/cms
      - /apps/docs
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns: ['*']
