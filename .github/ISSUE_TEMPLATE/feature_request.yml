name: Feature request
description: Suggest an improvement or a new feature.
labels: ['enhancement', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Areca CMS deliberately leaves some things out; [the design decisions](https://github.com/seirai-dev/areca-cms/blob/main/docs/DECISIONS.md) explain what and why.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, for example "As an agency owner, I have to ... every time I ...".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds or other tools you've tried.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
