name: CMS Docker ARM64

# Reusable only: cms-docker-amd64.yml calls this after CI passes. It has no
# direct trigger so images cannot be published without CI.
on:
  workflow_call:
    outputs:
      digest:
        description: ARM64 image digest
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push arm64
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/cms/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-arm64
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest-arm64', steps.image.outputs.name) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cms-arm64
          cache-to: type=gha,mode=max,scope=cms-arm64
