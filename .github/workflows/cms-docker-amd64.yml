name: CMS Docker AMD64 and multi-platform release

on:
  push:
    branches: [main]
    paths:
      - "apps/cms/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".dockerignore"
      - ".github/workflows/cms-docker-*.yml"
      - "docker/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize releases so an older run cannot overwrite a newer latest tag.
concurrency:
  group: cms-docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is built or pushed until typecheck, unit tests, secret scanning and
  # the client-bundle scan pass.
  ci:
    uses: ./.github/workflows/ci.yml
    # ci.yml's change detection job needs pull-requests read; a called workflow
    # cannot request more than the caller grants.
    permissions:
      contents: read
      pull-requests: read

  amd64:
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/cms/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-amd64
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest-amd64', steps.image.outputs.name) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cms-amd64
          cache-to: type=gha,mode=max,scope=cms-amd64

  arm64:
    needs: [ci]
    uses: ./.github/workflows/cms-docker-arm64.yml

  publish:
    needs: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish matching architectures under a shared tag
        env:
          IMAGE: ${{ needs.amd64.outputs.image }}
          AMD64_DIGEST: ${{ needs.amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.arm64.outputs.digest }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          tags=(--tag "$IMAGE:sha-$COMMIT")
          if [[ "$REF" == refs/heads/main ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"
          docker buildx imagetools inspect "$IMAGE:sha-$COMMIT"
