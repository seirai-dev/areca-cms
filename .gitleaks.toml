# Secret scanning policy. CI runs gitleaks over full git history
# (.github/workflows/ci.yml). Keep allowlists narrow: prefer a path for a
# specific fixture file over a broad rule or regex.
title = "Areca CMS gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Placeholder values in committed example env files"
paths = [
  '''(^|/)\.env\.example$''',
]

[[allowlists]]
description = "Test fixtures with deliberately fake credentials"
paths = [
  # Fixed dummy DOKPLOY_CREDENTIALS_ENCRYPTION_KEY used by the unit tests.
  '''(^|/)apps/cms/vitest\.config\.ts$''',
  # Fake secrets used to prove log redaction works.
  '''(^|/)apps/cms/src/server/log\.test\.ts$''',
  # Fake private-key header / connection strings proving the scanner matches.
  '''(^|/)apps/cms/scripts/scan-client-bundle\.test\.mjs$''',
  # Fake MCP keys and OAuth tokens in install-snippet and OAuth flow tests.
  '''(^|/)apps/cms/src/lib/mcp-install\.test\.ts$''',
  '''(^|/)apps/cms/src/server/mcp/oauth-flow\.test\.ts$''',
  # Fake TOTP secret for the agency OAuth flow DB test.
  '''(^|/)apps/cms/src/server/mcp/agency-oauth\.db\.test\.ts$''',
  # Fake BETTER_AUTH_SECRET values proving the production placeholder checks
  # (in history since c7147b3 and 4c6a6b9).
  '''(^|/)apps/cms/src/lib/secret-placeholders\.test\.ts$''',
]

[[allowlists]]
description = "Paraglide message keys: snake_case names such as agency_person_2fa_off look like generic API keys"
condition = "AND"
paths = [
  '''(^|/)apps/cms/messages/[a-z]{2}\.json$''',
]
regexTarget = "secret"
regexes = [
  # Only a whole snake_case message key; any other value in these files is still scanned.
  '''^[a-z][a-z0-9]*(_[a-z0-9]+)+$''',
]
