server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css text/markdown application/json application/javascript image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # A types block replaces the inherited MIME map, so include it first.
  include /etc/nginx/mime.types;
  types {
    text/markdown md;
  }

  # Hashed build assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Static search index (no file extension).
  location = /api/search {
    default_type application/json;
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404/index.html;
}
